[package]
name = "spawn-gateway"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "spawn_gateway"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "oapp/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
# 0.31.1 everywhere below: the version the LayerZero `oapp` crate pins —
# mixing two anchor-lang majors in one program is impossible, so the whole
# stack sits at LayerZero's level (see NOTES.md, "dependency matrix").
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
oapp = { package = "oapp-latest", git = "https://github.com/LayerZero-Labs/LayerZero-v2.git", rev = "c09287a" }

[dev-dependencies]
litesvm = "0.6.1"
solana-sdk = "2.2.1"
# litesvm 0.6's graph needs the 2.2 line exactly; stop cargo drifting to 2.3
solana-instruction = "=2.2.1"
serde_json = "1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
